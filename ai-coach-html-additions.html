<!-- ═══════════════════════════════════════════════════════════
     AI COACH — HTML ADDITIONS FOR index.html
     Add these elements inside your existing coach screen / AI chat section
     ═══════════════════════════════════════════════════════════ -->

<!-- ── 1. PROVIDER BADGE (add near top of AI chat panel) ──── -->
<div id="ai-provider-badge" style="text-align:center;padding:6px 16px 0"></div>

<!-- ── 2. QUICK ACTIONS STRIP (add above the message area) ── -->
<div id="ai-quick-actions" style="
  display:flex;gap:8px;overflow-x:auto;padding:8px 16px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--border)
"></div>

<!-- ── 3. CHAT MESSAGES (existing — keep as-is, ensure this id) ── -->
<div id="ai-chat-messages" style="
  flex:1;overflow-y:auto;padding:12px 16px;
  display:flex;flex-direction:column;gap:10px
"></div>

<!-- ── 4. TOOLBAR ABOVE INPUT ────────────────────────────────── -->
<div style="display:flex;gap:8px;padding:6px 16px 0;justify-content:flex-end;align-items:center">
  <!-- Inject last game PGN into input -->
  <button id="ai-pgn-btn" class="btn btn-ghost btn-sm" title="Send last game for analysis" style="font-size:11px">♟ Last Game</button>
  <!-- Copy last response -->
  <button id="ai-copy-btn" class="btn btn-ghost btn-sm" title="Copy last response" style="font-size:11px">⎘ Copy</button>
  <!-- Export chat -->
  <button id="ai-export-btn" class="btn btn-ghost btn-sm" title="Export chat" style="font-size:11px">↓ Export</button>
  <!-- Clear chat -->
  <button id="ai-clear-btn" class="btn btn-ghost btn-sm" title="Clear chat" style="font-size:11px">🗑</button>
</div>

<!-- ── 5. INPUT ROW (existing — ensure these ids) ──────────── -->
<div style="display:flex;gap:8px;padding:10px 16px 16px;align-items:flex-end">
  <textarea id="ai-input" rows="1" placeholder="Ask Coach Anand anything…"
    style="flex:1;resize:none;min-height:40px;max-height:120px;padding:10px 12px;
           border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);
           color:var(--text);font-size:14px;font-family:inherit;line-height:1.4"></textarea>
  <button id="ai-send-btn" class="btn btn-primary" style="height:40px;width:44px;padding:0;flex-shrink:0;font-size:18px">↑</button>
</div>

<!-- ── 6. DISCLAIMER ─────────────────────────────────────────── -->
<div style="text-align:center;padding:0 16px 10px;font-size:10px;color:var(--muted)">
  AI Coach gives general advice. Use engine analysis for precise move evaluation.
</div>

<!-- ═══════════════════════════════════════════════════════════
     CSS ADDITIONS — paste into your <style> block in index.html
     ═══════════════════════════════════════════════════════════ -->
<style>
/* AI message bubbles */
.ai-msg {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  animation: fadeSlideIn .2s ease;
}
.ai-msg.user {
  flex-direction: row-reverse;
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ai-bubble {
  max-width: 82%;
  padding: 10px 13px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text);
}
.assistant-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px 16px 16px 16px;
}
.user-bubble {
  background: var(--surface2, var(--brand-bg));
  border: 1px solid var(--border2, var(--border));
  border-radius: 16px 4px 16px 16px;
  margin-left: auto;
}
.ai-avatar {
  font-size: 20px;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--brand-bg, rgba(139,186,92,.15));
  border-radius: 50%;
  margin-top: 2px;
}

/* Thinking animation */
.ai-thinking {
  display: flex;
  gap: 4px;
  align-items: center;
  height: 18px;
}
.ai-thinking span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand);
  animation: bounce 1s infinite ease-in-out;
}
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
  40%           { transform: scale(1.1); opacity: 1; }
}

/* Quick action chips */
.ai-quick-btn:hover {
  border-color: var(--brand) !important;
  background: var(--brand-bg) !important;
  color: var(--text) !important;
}
/* Hide scrollbar on quick actions */
#ai-quick-actions::-webkit-scrollbar { display: none; }
</style>
