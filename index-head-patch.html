<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════
     Chess Academy — index.html HEAD (Android / TWA optimised)
     Replace your existing <head> block with this one.
     ═══════════════════════════════════════════════════════════ -->
<html lang="en-IN">
<head>
<meta charset="UTF-8">

<!-- ── Viewport ───────────────────────────────────────────────
     viewport-fit=cover lets content extend behind the Android
     nav bar / status bar; safe-area vars compensate below.    -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- ── PWA / manifest ─────────────────────────────────────────-->
<link rel="manifest" href="/manifest.json">
<title>Chess Academy</title>

<!-- ── Theme colour (Android status bar) ─────────────────────
     media queries let Chrome flip between dark/light status bar
     if the user changes system theme.                         -->
<meta name="theme-color" content="#8bba5c"
      media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#8bba5c"
      media="(prefers-color-scheme: light)">

<!-- ── Android / Chrome-specific ─────────────────────────────-->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Chess Academy">

<!-- ── Apple (iOS Safari fallback, not needed for TWA) ───────-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chess Academy">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<!-- ── SEO / Open Graph ───────────────────────────────────────-->
<meta name="description"
      content="Chess progress dashboard for students and coaches — track ratings, games, puzzles, and coach notes.">
<meta property="og:title"       content="Chess Academy">
<meta property="og:description" content="Track your chess journey">
<meta property="og:image"       content="/icons/icon-512.png">
<meta property="og:type"        content="website">

<!-- ── Preconnect: shave ~200 ms off first font load ─────────-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ── Fonts (display=swap prevents FOIT) ───────────────────── -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap">

<!-- ── Favicon ───────────────────────────────────────────────-->
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<style>
/* ─── Design Tokens ─────────────────────────────────────────── */
:root {
  --bg:        #0e0f0d;
  --bg2:       #161715;
  --bg3:       #1e1f1c;
  --surface:   #252623;
  --surface2:  #2d2e2b;
  --border:    #333430;
  --border2:   #3d3e3a;
  --muted:     #6b6c67;
  --text2:     #a8a99f;
  --text:      #e8e9e0;
  --brand:     #8bba5c;
  --brand2:    #6fa342;
  --brand3:    #b5d98a;
  --brand-bg:  rgba(139,186,92,.12);
  --saffron:   #f5a623;
  --saffron-bg:rgba(245,166,35,.12);
  --red:       #e05c5c;
  --red-bg:    rgba(224,92,92,.12);
  --blue:      #5b9bd5;
  --blue-bg:   rgba(91,155,213,.12);
  --accent:    #c8f77c;
  --r-sm: 6px; --r: 10px; --r-lg: 16px; --r-xl: 22px;
  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body:    'Outfit', sans-serif;
  --font-mono:    'DM Mono', monospace;
  --nav-h: 64px;

  /* ── Android safe-area insets ──────────────────────────────
     These pull padding away from the camera notch, status bar,
     and gesture nav bar automatically.                        */
  --safe-top:    env(safe-area-inset-top,    0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left,   0px);
  --safe-right:  env(safe-area-inset-right,  0px);
}

/* ─── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;               /* Dynamic viewport height — avoids address-bar jump */
  display: flex;
  flex-direction: column;
  /* Disable pull-to-refresh and elastic overscroll that feel wrong in a TWA */
  overscroll-behavior: none;
  /* Prevent text size inflation on orientation change */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  /* Faster tap response — removes 300 ms delay on Android */
  touch-action: manipulation;
}

/* ─── App Shell ──────────────────────────────────────────────── */
#app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  position: relative;
}

/* ─── Top Bar — pad for status bar height ────────────────────── */
#top-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + var(--safe-top)) 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 40;
}

/* ─── Bottom Nav — pad for gesture nav bar ───────────────────── */
#bottom-nav {
  padding-bottom: var(--safe-bottom);
}

/* ─── Touch feedback — improves feel on Android ─────────────── */
button, [role="button"], .nav-btn, .card, .filter-chip {
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

/* ─── Scrollable areas ───────────────────────────────────────── */
#viewport,
.modal-body {
  /* Momentum scrolling on Android WebView */
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* ─── Splash / loading state ─────────────────────────────────── */
#app-loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 9999;
  transition: opacity 0.3s ease;
}
#app-loading.hidden {
  opacity: 0;
  pointer-events: none;
}
#app-loading .logo {
  font-size: 56px;
  line-height: 1;
}
#app-loading .app-name {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--brand);
  letter-spacing: 0.04em;
}

/* ─── Install banner (Android Chrome) ───────────────────────── */
#install-banner {
  display: none;
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r-lg);
  padding: 12px 16px;
  width: calc(100% - 32px);
  max-width: 448px;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  flex-direction: column;
  gap: 10px;
  animation: slideUp 0.3s ease;
}
#install-banner.visible { display: flex; }
#install-banner-text {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.4;
}
#install-banner-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.install-btn-primary {
  background: var(--brand);
  color: #000;
  border: none;
  border-radius: var(--r);
  padding: 8px 18px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.install-btn-dismiss {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 8px 14px;
  font-family: var(--font-body);
  font-size: 14px;
  cursor: pointer;
}

@keyframes slideUp {
  from { transform: translateX(-50%) translateY(20px); opacity: 0; }
  to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
}

/* …rest of your existing styles go here unchanged… */
</style>
</head>
